services:
  - type: web
    name: tas3eerah
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      # Fill these in Render before sending branded production email.
      - key: APP_URL
        sync: false
      - key: PRIVATE_EMAIL_ADDRESS
        value: info@tas3eerah.com
      - key: PRIVATE_EMAIL_HOST
        value: mail.privateemail.com
      - key: PRIVATE_EMAIL_SMTP_PORT
        value: "465"
      - key: PRIVATE_EMAIL_IMAP_PORT
        value: "993"
      - key: PRIVATE_EMAIL_PASSWORD
        sync: false
      # Optional: only when the receiving mailbox is a different account.
      - key: PRIVATE_EMAIL_RECEIVE_PASSWORD
        sync: false
